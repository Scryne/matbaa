<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Matbaa · Pano</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d4402f'/%3E%3Cpath d='M9 22V10h4l3 6 3-6h4v12' fill='none' stroke='%23fbf9f4' stroke-width='3'/%3E%3C/svg%3E">
<style>
  /* Token'lar DESIGN.md frontmatter'ından (pano: kağıt; koyu tema: masa). Değer değişirse orada değişir. */
  @font-face { font-family: "Matbaa Serif"; src: url("/font/serif") format("truetype"); font-display: swap; }
  :root {
    --zemin: #f3efe6; --zemin-2: #ebe5d8; --yuzey: #fbf9f4; --cizgi: #e0d9ca; --cizgi-2: #cfc6b3;
    --metin: #1f1d1a; --metin-2: #605b52; --metin-3: #7c766a;
    --kirmizi: #c2392a; --yesil: #2a7f51; --sari: #94690c; --odak: #2f5fd0; --mavi: #3a64c8; --kagit-yazi: #fbf9f4;
    --serif: "Matbaa Serif", Georgia, "Times New Roman", serif;
    --govde: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    --r: 12px; --r-k: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --zemin: #17171a; --zemin-2: #1c1c20; --yuzey: #212125; --cizgi: #34343a; --cizgi-2: #45454c;
      --metin: #ecebe6; --metin-2: #a3a19a; --metin-3: #8c8a84;
      --kirmizi: #e0483e; --yesil: #3fb46b; --sari: #e2b23c; --odak: #8fb3ff; --mavi: #8fb3ff; --kagit-yazi: #17171a;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--zemin); }
  body { margin: 0; color: var(--metin); font: 15px/1.5 var(--govde); background: var(--zemin); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--odak); outline-offset: 2px; border-radius: 4px; }
  .ikon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .sayi { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .ust-etiket { font: 11px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--metin-3); }
  .soluk { color: var(--metin-2); }
  .kap { max-width: 1320px; margin: 0 auto; padding: 0 32px; }
  .bosluk { flex: 1; }

  /* Üst çubuk */
  .ust { border-bottom: 1px solid var(--cizgi); background: var(--zemin); position: sticky; top: 0; z-index: 20; }
  .ust .kap { display: flex; align-items: center; gap: 24px; height: 60px; }
  .marka { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .marka svg { width: 28px; height: 28px; }
  .marka b { font: 400 21px/1 var(--serif); }
  .marka span { font-size: 12px; color: var(--metin-3); }
  nav { display: flex; gap: 4px; }
  nav a { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: var(--r-k); text-decoration: none; color: var(--metin-2); font-size: 14px; }
  nav a:hover { color: var(--metin); background: var(--zemin-2); }
  nav a[aria-current="page"] { color: var(--metin); background: var(--yuzey); box-shadow: inset 0 0 0 1px var(--cizgi); }
  .rozet { font: 11px/18px var(--mono); min-width: 18px; padding: 0 5px; text-align: center; border-radius: 99px; background: var(--kirmizi); color: #fff; }
  .durum { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--metin-2); white-space: nowrap; }
  .nokta { width: 8px; height: 8px; border-radius: 50%; background: var(--metin-3); flex: none; }
  .nokta.iyi { background: var(--yesil); } .nokta.kotu { background: var(--kirmizi); } .nokta.uyari { background: var(--sari); }
  .nokta.canli { background: var(--mavi); animation: nabiz 1.4s ease-in-out infinite; }
  @keyframes nabiz { 50% { opacity: .3; } }

  /* Giriş: tek cümlelik durum + sıradaki iş (asimetrik 7/4) */
  .giris { display: grid; grid-template-columns: minmax(0, 7fr) minmax(320px, 4fr); gap: 56px; padding-top: 52px; padding-bottom: 44px; align-items: start; }
  .tarih { display: flex; align-items: center; gap: 10px; }
  .tarih .ikon { width: 18px; height: 18px; color: var(--kirmizi); }
  h1 { font: 400 clamp(34px, 4.4vw, 58px)/1.06 var(--serif); letter-spacing: -.01em; margin: 16px 0 22px; max-width: 18ch; text-wrap: balance; }
  h1 em { font-style: normal; color: var(--kirmizi); }
  .olgular { display: flex; flex-wrap: wrap; gap: 10px 32px; margin: 0; padding: 0; list-style: none; }
  .olgular li { display: flex; align-items: baseline; gap: 8px; }
  .olgular .sayi { font-size: 22px; font-weight: 600; color: var(--metin); }
  .olgular li > span:last-child { color: var(--metin-2); font-size: 14px; }

  .siradaki { position: relative; background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: var(--r); padding: 22px 22px 10px; }
  /* Baskı kesim işaretleri: provanın köşesi (farklılaştırıcı detay) */
  .siradaki::before, .siradaki::after { content: ""; position: absolute; width: 14px; height: 14px; border-color: var(--cizgi-2); border-style: solid; }
  .siradaki::before { top: -8px; left: -8px; border-width: 1px 0 0 1px; }
  .siradaki::after { bottom: -8px; right: -8px; border-width: 0 1px 1px 0; }
  .siradaki h2 { font: 400 23px/1.2 var(--serif); margin: 6px 0 4px; }
  .gorevler { list-style: none; margin: 14px 0 0; padding: 0; }
  .gorev { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-top: 1px solid var(--cizgi); font-size: 14px; }
  .gorev > .ikon { color: var(--metin-2); }
  .gorev.kotu > .ikon { color: var(--kirmizi); }
  .gorev.bilgi { color: var(--metin-2); }
  .gorev small { display: block; color: var(--metin-3); font-size: 12px; }
  .isim-form { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
  .isim-form input { width: 14ch; min-height: 34px; padding: 6px 10px; border-radius: var(--r-k); border: 1px solid var(--cizgi-2); background: var(--zemin); color: var(--metin); font: 14px var(--govde); }
  .isim-form input:disabled, .isim-form button:disabled { opacity: .55; }
  .isim-sonuc { flex-basis: 100%; font-size: 12px; color: var(--metin-2); }
  .isim-sonuc:empty { display: none; }
  .tiktok { padding-top: 16px; }
  .videolar { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 16px; }
  .video-kart { display: grid; grid-template-columns: 96px 1fr; gap: 14px; padding: 14px; border: 1px solid var(--cizgi); border-radius: var(--r-k); background: var(--zemin); min-width: 0; }
  .video-kart > a { display: block; border-radius: 6px; overflow: hidden; aspect-ratio: 9 / 16; background: var(--zemin-2); align-self: start; }
  .video-kart img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .video-kart .zaman { font: 12px/1.4 var(--mono); color: var(--kirmizi); }
  .video-kart .ai { display: inline-block; margin-left: 8px; vertical-align: 1px; }
  .video-kart b { display: block; font-size: 14px; line-height: 1.35; margin: 4px 0 6px; }
  .video-kart p { margin: 0 0 10px; font-size: 12px; line-height: 1.45; color: var(--metin-2); overflow-wrap: anywhere; }
  .video-kart .eylemler { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .gizli-etiket { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .btn { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 6px 12px; border-radius: var(--r-k); border: 1px solid var(--cizgi-2);
    background: var(--yuzey); color: var(--metin); font: 500 13px var(--govde); text-decoration: none; cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s; }
  .btn:hover { background: var(--zemin-2); border-color: var(--metin-3); }
  .btn:active { transform: translateY(1px); }
  .btn.ana { background: var(--metin); color: var(--kagit-yazi); border-color: var(--metin); }
  .btn.ana:hover { opacity: .88; }
  .btn.sade { border-color: transparent; background: transparent; color: var(--metin-2); padding: 4px 8px; min-height: 28px; }
  .btn.sade:hover { color: var(--metin); background: var(--zemin-2); }
  form { margin: 0; }

  /* Vitrin bandı: tam genişlik, gerçek ürün fotoğrafları */
  .vitrin { background: var(--zemin-2); border-block: 1px solid var(--cizgi); padding: 34px 0 38px; }
  .bolum-bas { display: flex; align-items: baseline; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .bolum-bas h2 { font: 400 28px/1.1 var(--serif); margin: 0; }
  .serit-kap { overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: thin; padding: 2px 2px 8px; }
  .kartlar { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 250px); gap: 16px; }
  .urun-kart { scroll-snap-align: start; background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; transition: border-color .15s, transform .2s; }
  .urun-kart:hover { border-color: var(--cizgi-2); transform: translateY(-2px); }
  .urun-kart .foto { aspect-ratio: 1; background: #fff; display: block; width: 100%; height: auto; object-fit: cover; }
  .urun-kart .foto.yok { display: grid; place-items: center; color: var(--metin-3); font-size: 13px; background: var(--zemin); }
  .urun-kart .ic { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .urun-kart h3 { font: 600 14px/1.3 var(--govde); margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
  .urun-kart h3 a { text-decoration: none; }
  .urun-kart h3 a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .urun-kart .meta { font-size: 12px; color: var(--metin-3); }
  .ciplar { display: flex; flex-wrap: wrap; gap: 4px; }
  .cip { font: 11px/20px var(--mono); padding: 0 7px; border-radius: 99px; border: 1px solid var(--cizgi); color: var(--metin-2); white-space: nowrap; text-decoration: none; }
  a.cip:hover { border-color: var(--metin-3); color: var(--metin); }
  .cip.uyari { color: var(--sari); border-style: dashed; } .cip.kotu { color: var(--kirmizi); }
  .olcum { display: flex; gap: 14px; margin-top: auto; font-size: 13px; color: var(--metin-2); }
  .olcum span { display: inline-flex; align-items: center; gap: 5px; }
  .olcum .ikon { width: 14px; height: 14px; }

  /* Bento: eşit olmayan döşemeler, boş hücre yok */
  .bento { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; padding-top: 40px; }
  .doseme { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: var(--r); padding: 20px 22px; min-width: 0; display: flex; flex-direction: column; }
  .doseme > header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
  .doseme h2 { font: 600 14px var(--govde); margin: 0; display: flex; align-items: center; gap: 8px; }
  .doseme h2 .ikon { color: var(--metin-3); }
  .g3 { grid-column: span 3; } .g2 { grid-column: span 2; }
  .buyuk { font: 600 42px/1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .buyuk.eksi { color: var(--kirmizi); } .buyuk.arti { color: var(--yesil); }
  .dokum { list-style: none; margin: 18px 0 0; padding: 0; font-size: 14px; }
  .dokum li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px dashed var(--cizgi); }
  .dokum li.toplam { border-top: 1px solid var(--cizgi-2); font-weight: 600; }
  .olcer { height: 6px; border-radius: 99px; background: var(--zemin-2); overflow: hidden; margin: 8px 0 6px; }
  .olcer > i { display: block; height: 100%; background: var(--yesil); border-radius: inherit; min-width: 2px; }
  .olcer.uyari > i { background: var(--sari); } .olcer.kotu > i { background: var(--kirmizi); }
  .not { font-size: 13px; color: var(--metin-2); margin: 12px 0 0; max-width: 62ch; }
  .grafik svg { display: block; width: 100%; height: auto; }
  .grafik text { font: 11px var(--mono); fill: var(--metin-3); }
  .huni { display: flex; flex-direction: column; gap: 12px; }
  .huni-satir { display: grid; grid-template-columns: 96px 1fr 34px; gap: 10px; align-items: center; font-size: 13px; }
  .huni-satir .bar { height: 10px; border-radius: 99px; background: var(--zemin-2); overflow: hidden; }
  .huni-satir .bar i { display: block; height: 100%; border-radius: inherit; background: var(--metin-3); }
  .huni-satir.yayin .bar i { background: var(--yesil); } .huni-satir.onay .bar i { background: var(--sari); }
  .adimlar { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .adimlar li { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center; padding: 5px 0; }
  .adimlar .ikon { width: 15px; height: 15px; color: var(--yesil); }
  .adimlar .bos .ikon { color: var(--metin-3); } .adimlar .kotu .ikon { color: var(--kirmizi); }
  .adimlar .sag { font: 12px var(--mono); color: var(--metin-3); }
  details summary { cursor: pointer; font-size: 13px; color: var(--metin-2); margin-top: 12px; width: fit-content; }
  details p { font-size: 13px; color: var(--metin-2); margin: 6px 0 0; }

  /* Alt: siparişler (liste) + etkinlik (zaman çizelgesi), asimetrik 7/5 */
  .alt { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 16px; padding-top: 16px; padding-bottom: 28px; align-items: start; }
  .sol-sutun { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .liste { width: 100%; border-collapse: collapse; font-size: 14px; }
  .liste th { text-align: left; font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--metin-3); font-weight: 400; padding: 0 8px 8px; }
  .liste td { padding: 10px 8px; border-top: 1px solid var(--cizgi); vertical-align: top; }
  .liste .n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .bos-durum { display: flex; gap: 14px; align-items: flex-start; padding: 4px 0; color: var(--metin); font-size: 14px; }
  .bos-durum .ikon { width: 22px; height: 22px; color: var(--metin-3); margin-top: 1px; }
  .bos-durum span { color: var(--metin-2); font-size: 13px; }
  .zaman-cizelgesi { list-style: none; margin: 0; padding: 0; }
  .gun-bas { font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--metin-3); padding: 14px 0 4px; }
  .gun-bas:first-child { padding-top: 0; }
  .olay { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 10px; padding: 6px 0; font-size: 14px; align-items: baseline; }
  .olay > span { overflow-wrap: anywhere; }  /* boşluksuz uzun hata metni (yol, URL) dar ekranda satırı taşırmasın */
  .olay::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--cizgi-2); transform: translateY(-1px); }
  .olay.iyi::before { background: var(--yesil); } .olay.kotu::before { background: var(--kirmizi); }
  .olay b { font-weight: 600; }
  .olay time { font: 12px var(--mono); color: var(--metin-3); }

  /* Yol haritası şeridi */
  .segmentler { display: grid; grid-template-columns: repeat(var(--n, 17), 1fr); gap: 3px; margin-top: 16px; }
  .segmentler i { height: 8px; border-radius: 2px; background: var(--zemin-2); box-shadow: inset 0 0 0 1px var(--cizgi); }
  .segmentler i.bitti { background: var(--yesil); box-shadow: none; } .segmentler i.suruyor { background: var(--mavi); box-shadow: none; }
  .fazlar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .fazlar .cip { font-family: var(--govde); font-size: 12px; line-height: 24px; padding: 0 10px; }
  .fazlar .cip b { font-family: var(--mono); font-weight: 400; color: var(--metin-3); margin-right: 4px; }
  footer { font-size: 12px; color: var(--metin-3); padding-bottom: 36px; }

  /* İlk yükleme: bölümler sırayla belirir (dakikalık yenilemede tekrarlanmaz) */
  .ilk .belir { animation: belir .45s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--s, 0) * 60ms); }
  @keyframes belir { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { .ilk .belir { animation: none; } .nokta.canli { animation: none; } .urun-kart, .btn { transition: none; } .urun-kart:hover { transform: none; } }

  @media (max-width: 1100px) { .bento { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-column: span 1; } .g2 { grid-column: span 1; } .g2.son { grid-column: span 2; } }
  @media (max-width: 900px) {
    .giris { grid-template-columns: 1fr; gap: 32px; padding-top: 32px; }
    .alt { grid-template-columns: 1fr; }
    .ust .kap { gap: 12px; } .marka span, .durum .uzun { display: none; }
  }
  @media (max-width: 640px) {
    .kap { padding: 0 16px; }
    .bento { grid-template-columns: 1fr; } .g3, .g2, .g2.son { grid-column: span 1; }
    nav a.ikincil { display: none; } .ust .kap { height: 56px; }
    .olgular { gap: 8px 20px; } .olgular .sayi { font-size: 18px; }
    .liste .gizle-dar { display: none; }
    .gorev { grid-template-columns: 20px 1fr; } .gorev > div:last-child { grid-column: 2; }
  }
</style>
</head>

<script>
const URUN = { tisort: "Tişört", sweatshirt: "Sweatshirt", hoodie: "Hoodie", susleme: "Süs", isimli_susleme: "İsimli süs", kupa: "Kupa" };
const URUN_SIRA = ["tisort", "sweatshirt", "hoodie", "susleme", "isimli_susleme", "kupa"];
const URUN_DURUM = { printify: "Printify'da", etsy_taslak: "taslak", olusturuldu: "hazırlanıyor", hata: "hata" };
const ISIMLI = { yeni: "Yeni", acildi: "Printify'da", uretimde: "Üretimde", takip_yazildi: "Kargoda", iptal: "İptal", hata: "Hata", elle: "Elle bakılmalı", kapandi: "Elle kapatıldı" };
const ADIM = { yayin: "Yayın", etsy: "Etsy eşleme", gorsel: "Galeri", mevsimlik: "Süs ilanları", pinterest: "Pin kuyruğu", tiktok: "TikTok videoları", isimli: "İsimli siparişler", siparis: "Sipariş takibi" };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ik = ad => `<svg class="ikon" aria-hidden="true"><use href="#i-${ad}"/></svg>`;
const sayi = n => n == null ? "0" : Number(n).toLocaleString("tr-TR");
const para = n => (n < 0 ? "−$" : "$") + Math.abs(n || 0).toFixed(2);
const tarihOku = s => new Date(String(s).replace(" ", "T"));
const saat = d => d.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
const kisaTarih = d => d.toLocaleDateString("tr-TR", { day: "numeric", month: "short" });
const gunAdi = d => {
  const bugun = new Date(); bugun.setHours(0, 0, 0, 0);
  const g = new Date(d); g.setHours(0, 0, 0, 0);
  const fark = Math.round((g - bugun) / 864e5);
  return fark === 0 ? "Bugün" : fark === -1 ? "Dün" : fark === 1 ? "Yarın" : d.toLocaleDateString("tr-TR", { day: "numeric", month: "long" });
};
const gizlenen = () => { try { return JSON.parse(localStorage.getItem("pano-gizli") || "[]"); } catch { return []; } };
function gizle(anahtar) { try { localStorage.setItem("pano-gizli", JSON.stringify([...gizlenen(), anahtar])); } catch {} ciz(son); }

let son = null;

function ust(d) {
  const k = d.son_kosu;
  let nokta = "", metin = "Henüz günlük koşu yok";
  if (k?.suruyor) { nokta = "canli"; metin = "Günlük koşu sürüyor"; }
  else if (k) {
    const sorun = k.hatalar.length + k.alarmlar.length, z = tarihOku(k.basladi);
    nokta = k.hatalar.length ? "kotu" : k.alarmlar.length ? "uyari" : "iyi";
    metin = `Son koşu ${gunAdi(z).toLocaleLowerCase("tr-TR")} ${saat(z)}, ${sorun ? sorun + " sorun" : "sorunsuz"}`;
  }
  $("durum").innerHTML = `<span class="nokta ${nokta}"></span><span class="uzun">${esc(metin)}</span>`;
  const onay = d.hat.tasarim.onay_bekliyor || 0;
  $("onay-rozet").hidden = !onay; $("onay-rozet").textContent = onay;
  $("magaza").href = $("magaza-2").href = d.magaza_url;
}

function giris(d) {
  const o = d.ozet, k = o.kar_30g;
  $("tarih").textContent = new Date().toLocaleDateString("tr-TR", { day: "numeric", month: "long", weekday: "long" }) + (d.acilis ? ` · mağazanın ${Math.floor((new Date().setHours(0, 0, 0, 0) - new Date(d.acilis + "T00:00:00")) / 864e5) + 1}. günü` : "");
  let manset;
  if (k.siparis > 0) manset = `Son 30 günde <em>${k.siparis} sipariş</em>, ${para(k.net_usd)} net kâr.`;
  else if (o.views > 0) manset = `${o.aktif_ilan} ilan vitrinde, <em>${sayi(o.views)} kez</em> görüldü. İlk sipariş bekleniyor.`;
  else manset = `${o.aktif_ilan} ilan vitrinde. İlk ziyaretçiler <em>bekleniyor.</em>`;
  $("manset").innerHTML = manset;
  const olgu = (n, ad) => `<li><span class="sayi">${n}</span><span>${ad}</span></li>`;
  $("olgular").innerHTML = olgu(sayi(o.views), "görüntülenme") + olgu(sayi(o.favori), "favori") + olgu(sayi(k.siparis), "sipariş (30 gün)")
    + olgu(sayi(d.hat.tasarim.onaylandi), "tasarım sırada");
}

function siradaki(d) {
  const s = d.sonraki_kosu, m = s && s.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})\s+(\d{1,2}):(\d{2})/);
  const t = m ? new Date(+m[3], +m[2] - 1, +m[1], +m[4], +m[5]) : null;
  $("siradaki-bas").textContent = t ? `Günlük koşu ${gunAdi(t).toLocaleLowerCase("tr-TR")} ${saat(t)}` : "Günlük koşu zamanlanmamış";
  $("siradaki-alt").textContent = `${d.hat.gunluk_sinir} yeni tasarım yayına girer; süs ilanları, siparişler ve pinler güncellenir.`;

  const g = [], gizli = gizlenen();
  // İsimli sipariş alarmları aşağıda eylemleriyle (isim düzelt / elle hallettim) tek satır olarak gelir.
  const alarm = [...(d.son_kosu?.hatalar || []).map(h => "Koşu hatası: " + h), ...(d.son_kosu?.alarmlar || []).filter(a => !a.startsWith("isimli makbuz")), ...d.siparisler.geciken];
  [...new Set(alarm)].forEach(a => g.push({ tur: "kotu", ikon: "uyari", metin: esc(a) }));
  d.siparisler.isimli.filter(x => x.durum === "hata" || x.durum === "elle").forEach(x => g.push({ tur: "kotu", ikon: "uyari",
    metin: `İsimli sipariş ${esc(x.etsy_receipt_id)} ${x.durum === "elle" ? "elle bakılmalı" : "açılamadı"}`, alt: isimliNeden(x),
    ek: x.durum === "hata" ? isimliForm(x) : "",
    eylem: `<button class="btn sade" type="button" data-makbuz="${esc(x.etsy_receipt_id)}" onclick="isimliKapat(this.dataset.makbuz, this)">Elle hallettim</button>` }));
  const tt = d.tiktok.hazir;
  if (tt.length) g.push({ ikon: "video", metin: `${tt.length} TikTok videosu paylaşılmayı bekliyor`,
    alt: `Sıradaki: ${ttZaman(tt[0].plan_tr)}. TikTok Studio'da zamanla`, eylem: `<a class="btn" href="#tiktok-bolum">Videolar</a>` });
  const onay = d.hat.tasarim.onay_bekliyor || 0;
  if (onay) g.push({ ikon: "onay", metin: `${onay} tasarım onayını bekliyor`, alt: "Onaylananlar yayın sırasına girer", eylem: `<a class="btn" href="/onay">Onay masası</a>` });
  const p = d.pinterest;
  if (p.bekleyen) g.push({ ikon: "raptiye", metin: p.verilen ? `${p.bekleyen} yeni pin hazır` : `İlk ${p.bekleyen} pin hazır`,
    alt: p.verilen ? "CSV'yi indirip Pinterest'e yükle" : "Pinterest işletme hesabı aç, CSV'yi yükle",
    eylem: `<form method="post" action="/pinterest/indir"><button class="btn ana" type="submit">${ik("indir")}CSV indir</button></form>` });
  // İndirilen dosya "Yükledim" denene kadar burada kalır: tarayıcı indirmeyi sessizce düşürse de pinler kaybolmaz.
  if (p.son_dosya && !gizli.includes("pin-" + p.son_dosya.dosya))
    g.push({ ikon: "raptiye", metin: `${p.son_dosya.adet} pinlik dosya Pinterest'e yüklenmeyi bekliyor`,
      alt: "Pinterest: Ayarlar, İçeriği içe aktar, .csv yükle",
      eylem: `<a class="btn" href="/pinterest/son" download="${esc(p.son_dosya.dosya)}">${ik("indir")}İndir</a> <button class="btn sade" type="button" onclick="gizle('pin-${esc(p.son_dosya.dosya)}')">Yükledim</button>` });
  if (d.acilis) {
    const ads = new Date(d.acilis + "T00:00:00"); ads.setDate(ads.getDate() + 15);
    if (new Date() >= ads) {
      if (!gizli.includes("etsy-ads")) g.push({ ikon: "hoparlor", metin: "Etsy Ads açılabilir", alt: "Günde $1-3 ile başla: Shop Manager, Marketing",
        eylem: `<button class="btn sade" type="button" onclick="gizle('etsy-ads')">Yaptım</button>` });
    } else g.push({ tur: "bilgi", ikon: "hoparlor", metin: `Etsy Ads ${ads.toLocaleDateString("tr-TR", { day: "numeric", month: "long" })} tarihinde açılabilir`, alt: "Yeni mağazalarda 15 gün bekleme var" });
  }
  // Yazılmakta olan isim formu 60 sn'lik yenilemede silinmesin
  if ($("gorevler").contains(document.activeElement) && document.activeElement.tagName === "INPUT") return;
  $("gorevler").innerHTML = g.length ? g.map(x => `<li class="gorev ${x.tur || ""}">${ik(x.ikon)}<div>${x.metin}${x.alt ? `<small>${esc(x.alt)}</small>` : ""}${x.ek || ""}</div><div>${x.eylem || ""}</div></li>`).join("")
    : `<li class="gorev">${ik("tik")}<div>Şimdilik senden beklenen bir şey yok.</div><div></div></li>`;
}

// Ham hata metni (EksikGlif, Printify durumu) yerine ne oldu, neden, ne yapmalı.
function isimliNeden(x) {
  const h = x.hata || "";
  if (h.startsWith("panelden isim verildi")) return "İsim kaydedildi; sonraki günlük koşu bu isimle açar.";
  if (/EksikGlif|glif|fontunda yok/i.test(h)) return "İsimde baskı fontunun basamadığı bir harf var. Alıcıya Etsy'den yaz, basılabilir yazımı gir.";
  if (/boş isim|isim yok/i.test(h)) return "Alıcı isim yazmamış. Etsy'den sor, gelen ismi gir.";
  return h;
}

function isimliForm(x) {
  const m = esc(x.etsy_receipt_id);
  const alanlar = x.kalemler.map((k, i) => `<label class="gizli-etiket" for="isim-${m}-${i}">Basılacak isim${x.kalemler.length > 1 ? ` (${i + 1}. süs)` : ""}</label>
    <input id="isim-${m}-${i}" name="${esc(k.transaction_id)}" value="${esc(k.isim || "")}" maxlength="14" required autocomplete="off" spellcheck="false" placeholder="İsim">`).join("");
  return `<form class="isim-form" onsubmit="return isimliIsim(event, '${m}')">${alanlar}<button class="btn" type="submit">İsimle aç</button><output class="isim-sonuc" role="status"></output></form>`;
}

async function isimliGonder(url, govde, cikti) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: govde ? JSON.stringify(govde) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { if (cikti) cikti.textContent = j.detail || `Kaydedilemedi (${r.status})`; return false; }
  return true;
}

async function isimliIsim(e, makbuz) {
  e.preventDefault();
  const f = e.target, isimler = {};
  f.querySelectorAll("input").forEach(i => { isimler[i.name] = i.value; });
  const cikti = f.querySelector("output");
  cikti.textContent = "Denetleniyor…";
  if (await isimliGonder(`/api/isimli/${encodeURIComponent(makbuz)}/isim`, { isimler }, cikti)) {
    cikti.textContent = "Kaydedildi. Sonraki günlük koşu bu isimle açar; hemen açmak için: uv run matbaa isimli";
    f.querySelectorAll("input, button[type=submit]").forEach(x => { x.disabled = true; });
  }
  return false;
}

async function isimliKapat(makbuz, dugme) {
  const cikti = dugme.closest("li").querySelector("output") || dugme.closest("li").querySelector("small");
  if (await isimliGonder(`/api/isimli/${encodeURIComponent(makbuz)}/kapat`, null, cikti)) yukle();
}

function vitrin(d) {
  const gruplar = new Map();
  for (const x of d.ilanlar) {
    if (!gruplar.has(x.tasarim)) gruplar.set(x.tasarim, { tasarim: x.tasarim, slogan: x.slogan, nis: x.nis, urunler: [], views: 0, favori: 0 });
    const g = gruplar.get(x.tasarim);
    g.urunler.push(x); g.views += x.views || 0; g.favori += x.favori || 0;
  }
  for (const g of gruplar.values()) {
    g.urunler.sort((a, b) => URUN_SIRA.indexOf(a.urun) - URUN_SIRA.indexOf(b.urun));
    const kapak = g.urunler.find(x => x.durum === "aktif" && x.gorsel);  // tişört önce: tasarımın en tanıdık yüzü
    g.gorsel = kapak?.gorsel; g.url = kapak?.url || g.urunler.find(x => x.url)?.url;
  }
  const l = [...gruplar.values()].sort((a, b) => b.views - a.views || b.favori - a.favori || b.tasarim - a.tasarim);
  const aktif = d.ilanlar.filter(x => x.durum === "aktif").length;
  $("vitrin-not").textContent = `${l.length} tasarım, ${aktif} ilan`;
  if (!l.length) { $("kartlar").innerHTML = `<p class="soluk">Henüz yayında ilan yok. Onaylanan tasarımlar her gün sırayla yayına girer.</p>`; return; }
  const cip = x => {
    const ad = esc(URUN[x.urun] || x.urun);
    if (x.durum !== "aktif") return `<span class="cip ${x.durum === "hata" ? "kotu" : "uyari"}" title="${esc(URUN_DURUM[x.durum] || x.durum)}">${ad}</span>`;
    return `<a class="cip" href="${esc(x.url)}" target="_blank" rel="noopener" title="$${(x.fiyat || 0).toFixed(2)}, Etsy'de aç">${ad}</a>`;
  };
  $("kartlar").innerHTML = l.map(g => `
    <article class="urun-kart">
      ${g.gorsel ? `<a href="${esc(g.url)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true"><img class="foto" src="${esc(g.gorsel)}" alt="" loading="lazy" width="250" height="250"></a>` : `<div class="foto yok">Görsel bekleniyor</div>`}
      <div class="ic">
        <h3><a href="${esc(g.url || "#")}" target="_blank" rel="noopener">${esc(g.slogan)}</a></h3>
        <div class="meta">#${g.tasarim} · ${esc(g.nis)}</div>
        <div class="ciplar">${g.urunler.map(cip).join("")}</div>
        <div class="olcum"><span title="Görüntülenme">${ik("goz")}<span class="sayi">${sayi(g.views)}</span></span><span title="Favori">${ik("kalp")}<span class="sayi">${sayi(g.favori)}</span></span></div>
      </div>
    </article>`).join("");
}

function paraKart(d) {
  const ay = d.ozet.ay, h = d.hat;
  $("ay-adi").textContent = new Date().toLocaleDateString("tr-TR", { month: "long", year: "numeric" });
  const oran = h.ilan_tavani ? Math.min(100, 100 * h.ilan_ucreti / h.ilan_tavani) : 0;
  $("para").innerHTML = `
    <div class="ust-etiket">Net kâr</div>
    <div class="buyuk ${ay.net_usd < 0 ? "eksi" : ay.net_usd > 0 ? "arti" : ""}" style="margin-top:8px">${para(ay.net_usd)}</div>
    <ul class="dokum">
      <li><span>Sipariş</span><span class="sayi">${sayi(ay.siparis)}</span></li>
      <li><span>Ciro</span><span class="sayi">${para(ay.brut_usd)}</span></li>
      <li><span>Siparişlerin neti <span class="soluk">(Etsy ücretleri ve üretim düşülmüş)</span></span><span class="sayi">${para(ay.siparis_net_usd)}</span></li>
      <li><span>İlan ücreti</span><span class="sayi">${para(-ay.ilan_ucreti_usd)}</span></li>
      <li class="toplam"><span>Net</span><span class="sayi">${para(ay.net_usd)}</span></li>
    </ul>
    <div style="margin-top:18px"><div class="ust-etiket">İlan bütçesi</div>
      <div class="olcer ${oran > 90 ? "kotu" : oran > 70 ? "uyari" : ""}" role="meter" aria-label="Bu ay ilan ücreti" aria-valuemin="0" aria-valuemax="${h.ilan_tavani}" aria-valuenow="${h.ilan_ucreti}"><i style="width:${oran.toFixed(1)}%"></i></div>
      <div class="sayi soluk" style="font-size:12px">${para(h.ilan_ucreti)} / ${para(h.ilan_tavani)}. Satış geldikçe tavan büyür.</div></div>`;
}

function grafik(d) {
  const s = d.goruntulenme.seri.slice(1);
  $("gor-not").textContent = s.length ? `son ${s.length} gün` : "";
  if (!s.length) { $("grafik").innerHTML = `<p class="not">Görüntülenme günlük koşuda ölçülür. Grafik ikinci ölçümden sonra çıkar.</p>`; return; }
  const W = 560, H = 190, alt = 26, sol = 30, ust = 10, maks = Math.max(4, ...s.map(x => x.artis || 0));
  const adim = Math.ceil(maks / 4), tepe = adim * 4, y = v => ust + (H - alt - ust) * (1 - v / tepe);
  const gw = (W - sol) / Math.max(s.length, 7), bw = Math.max(8, Math.min(34, gw * .6));
  const izgara = [0, 1, 2, 3, 4].map(i => `<line x1="${sol}" x2="${W}" y1="${y(i * adim)}" y2="${y(i * adim)}" stroke="var(--cizgi)" ${i ? 'stroke-dasharray="2 5"' : ""}/><text x="${sol - 8}" y="${y(i * adim) + 4}" text-anchor="end">${i * adim}</text>`).join("");
  const bar = s.map((x, i) => {
    const v = x.artis || 0, cx = sol + gw * i + (gw - bw) / 2, h = Math.max(v ? 3 : 2, H - alt - y(v));
    return `<rect x="${cx.toFixed(1)}" y="${(H - alt - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${v ? "var(--yesil)" : "var(--cizgi-2)"}"><title>${kisaTarih(tarihOku(x.tarih + "T00:00"))}: ${v} yeni görüntülenme</title></rect>`
      + `<text x="${(cx + bw / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${kisaTarih(tarihOku(x.tarih + "T00:00"))}</text>`;
  }).join("");
  const toplam = s.reduce((a, x) => a + (x.artis || 0), 0);
  $("grafik").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Son ${s.length} günde ${toplam} yeni görüntülenme">${izgara}${bar}</svg>
    ${toplam ? "" : `<p class="not">Henüz görüntülenme yok. Yeni ilanların Etsy aramasında yer bulması zaman alır; Pinterest pinleri ilk dış trafiği getirecek.</p>`}`;
}

function hat(d) {
  const t = d.hat.tasarim, n = [t.onay_bekliyor || 0, t.onaylandi || 0, t.yayinda || 0], maks = Math.max(...n, 1);
  const satir = (ad, v, sinif) => `<div class="huni-satir ${sinif}"><span>${ad}</span><span class="bar"><i style="width:${(100 * v / maks).toFixed(1)}%"></i></span><span class="sayi" style="text-align:right">${sayi(v)}</span></div>`;
  $("hat-not").textContent = `${sayi(t.ret)} ret`;
  $("hat").innerHTML = `<div class="huni">${satir("Onay bekliyor", n[0], "onay")}${satir("Sırada", n[1], "")}${satir("Yayında", n[2], "yayin")}</div>
    <p class="not">Günde ${d.hat.gunluk_sinir} tasarım yayına girer${d.hat.kuyruk_gun != null ? `; sıra bu hızla ~${Math.round(d.hat.kuyruk_gun)} gün yeter` : ""}. Hız mağaza yaşlandıkça artar.</p>`;
}

function pinKart(d) {
  const p = d.pinterest, s = p.son_dosya;
  $("pin-not").textContent = "günde 3 pin";
  $("pinterest").innerHTML = `<div class="buyuk">${sayi(p.bekleyen)}</div><div class="soluk" style="font-size:13px;margin-top:6px">pin yüklenmeyi bekliyor</div>
    ${p.bekleyen ? `<form method="post" action="/pinterest/indir" style="margin-top:16px"><button class="btn ana" type="submit">${ik("indir")}CSV indir</button></form>` : ""}
    ${s ? `<p class="not">Son dosya: ${sayi(s.adet)} pin, ${kisaTarih(tarihOku(s.ilk))} ile ${kisaTarih(tarihOku(s.son))} arası. <a href="/pinterest/son">Yeniden indir</a></p>` : ""}
    <details><summary>Nasıl yüklenir</summary><p>Pinterest işletme hesabında, bilgisayardan: Ayarlar, İçeriği içe aktar, .csv yükle. Panolar kendiliğinden açılır, pinler dosyadaki saatlerde yayınlanır.</p></details>`;
}

function ttZaman(s) {
  const z = new Date(s);  // plan_tr: Türkiye saatiyle "YYYY-MM-DDTHH:MM" (tarayıcı da Türkiye'de)
  return `${z.toLocaleDateString("tr-TR", { day: "numeric", month: "long", weekday: "long" })} ${saat(z)}`;
}

function tiktokKart(d) {
  const t = d.tiktok, bolum = $("tiktok-bolum");
  bolum.hidden = !t.hazir.length && !t.paylasilan;
  if (bolum.hidden) return;
  $("tiktok-not").textContent = `${t.paylasilan} paylaşıldı · günde 2, ABD 12:00 ve 19:00`;
  if ($("tiktok").contains(document.activeElement) && document.activeElement.matches("button")) return;
  $("tiktok").innerHTML = (t.hazir.length ? `<div class="videolar">${t.hazir.map(v => `<div class="video-kart">
      <a href="/tiktok/${v.id}/video.mp4" target="_blank" rel="noopener" aria-label="Videoyu izle: ${esc(v.slogan)}"><img src="/tiktok/${v.id}/kapak.jpg" alt="" loading="lazy"></a>
      <div><span class="zaman">${esc(ttZaman(v.plan_tr))}</span>${v.ai ? `<span class="cip uyari ai" title="Gerçekçi yapay zekâ insanı içeriyor: TikTok'ta Yapay zekâ ile oluşturulmuş içerik anahtarını aç">Giyilmiş · AI etiketini aç</span>` : ""}<b>${esc(v.hook)}</b><p>${esc(v.gonderi)}</p>
        <div class="eylemler"><a class="btn ana" href="/tiktok/${v.id}/video.mp4" download>${ik("indir")}Video</a>
          <button class="btn" type="button" onclick="ttKopyala(this, ${v.id})">${ik("kopya")}Açıklama</button>
          <button class="btn sade" type="button" onclick="ttPaylasildi(${v.id}, this)">Zamanladım</button></div>
        <output class="isim-sonuc" role="status"></output></div></div>`).join("")}</div>`
    : `<p class="not">Paylaşılmayı bekleyen video yok. Yeni tasarım yayına girdikçe günlük koşu videosunu hazırlar.</p>`)
    + `<details><summary>Nasıl paylaşılır</summary><p>Bilgisayarda tiktok.com/tiktokstudio/upload: videoyu seç, açıklamayı yapıştır, "Zamanla"da karttaki saati seç (10 güne kadar ileri), sonra burada "Zamanladım". "Giyilmiş" videolarda gerçekçi yapay zekâ insanı var: Daha fazla göster altında "Yapay zekâ ile oluşturulmuş içerik" anahtarını aç (TikTok kuralı). Telefondan paylaşırsan TikTok'un ticari müzik kütüphanesinden popüler bir ses ekle. Ülke dağılımını ilk 10 videodan sonra TikTok Studio, Analiz, İzleyiciler'de kontrol et.</p></details>`;
}

async function ttKopyala(dugme, id) {
  const v = son.tiktok.hazir.find(x => x.id === id), cikti = dugme.closest(".video-kart").querySelector("output");
  try { await navigator.clipboard.writeText(v.gonderi); cikti.textContent = "Açıklama kopyalandı."; }
  catch { cikti.textContent = "Kopyalanamadı: metni seçip elle kopyala."; }
}

async function ttPaylasildi(id, dugme) {
  const r = await fetch(`/api/tiktok/${id}/paylasildi`, { method: "POST" });
  if (r.ok) yukle(); else dugme.closest(".video-kart").querySelector("output").textContent = "Kaydedilemedi, sayfayı yenile.";
}

function kosuKart(d) {
  const k = d.son_kosu;
  if (!k) { $("kosu").innerHTML = `<p class="not">Henüz günlük koşu kaydı yok.</p>`; return; }
  $("kosu-not").textContent = `${saat(tarihOku(k.basladi))}, ${Math.max(1, Math.round((k.sure_sn || 0) / 60))} dk`;
  const ozet = (ad, v) => {
    if (typeof v === "string") return [v, "bos"];
    const parca = { yayin: [v.tasarim && `${v.tasarim} tasarım`, v.urun && `${v.urun} ürün`], etsy: [v.aktif && `${v.aktif} aktif`], gorsel: [v.tamam && `${v.tamam} galeri`],
      mevsimlik: [v.acilan && `${v.acilan} ilan`], pinterest: [v.eklenen && `${v.eklenen} pin`], tiktok: [v.hazir && `${v.hazir} video`], isimli: [v.yeni && `${v.yeni} yeni`, v.takip && `${v.takip} kargo`],
      siparis: [v.yeni && `${v.yeni} yeni`] }[ad] || [];
    const metin = parca.filter(Boolean).join(", ");
    return v.hata ? [`${v.hata} hata`, "kotu"] : [metin || "iş yok", metin ? "" : "bos"];
  };
  $("kosu").innerHTML = `<ul class="adimlar">${Object.entries(k.adimlar).map(([a, v]) => { const [m, t] = ozet(a, v);
    return `<li class="${t}">${ik(t === "kotu" ? "carpi" : t === "bos" ? "cizgi" : "tik")}<span>${esc(ADIM[a] || a)}</span><span class="sag">${esc(m)}</span></li>`; }).join("")}</ul>
    ${k.hatalar.length ? `<p class="not" style="color:var(--kirmizi)">${k.hatalar.map(esc).join("<br>")}</p>` : ""}`;
}

function siparisKart(d) {
  const s = d.siparisler;
  $("sip-not").textContent = s.son.length ? `son ${s.son.length}` : "";
  let h = s.son.length ? `<table class="liste"><thead><tr><th>Tarih</th><th>Tasarım</th><th class="n">Ciro</th><th class="n">Net</th><th class="gizle-dar">Durum</th></tr></thead><tbody>${
    s.son.map(x => `<tr><td class="sayi" style="white-space:nowrap">${kisaTarih(tarihOku(x.olusturma))}</td>
      <td><b>${esc(x.slogan || "–")}</b><div class="soluk" style="font-size:12px">makbuz ${esc(x.etsy_receipt_id)}${x.takip ? ` · takip ${esc(x.takip)}` : ""}</div></td>
      <td class="n">${para(x.brut)}</td><td class="n" style="${x.net < 0 ? "color:var(--kirmizi)" : ""}">${para(x.net)}</td><td class="gizle-dar"><span class="cip">${esc(x.durum || "–")}</span></td></tr>`).join("")}</tbody></table>`
    : `<div class="bos-durum">${ik("canta")}<div>Henüz sipariş yok.<br><span>İlk sipariş geldiğinde burada, Etsy ücretleri ve üretim düşülmüş gerçek kârıyla görünür.</span></div></div>`;
  if (s.isimli.length) h += `<div class="ust-etiket" style="margin:20px 0 4px">İsimli süs siparişleri</div><table class="liste"><tbody>${
    s.isimli.map(x => `<tr><td><b>${esc(x.isimler.filter(Boolean).join(", ") || "–")}</b><div class="soluk" style="font-size:12px">makbuz ${esc(x.etsy_receipt_id)}</div></td>
      <td><span class="cip ${x.durum === "hata" || x.durum === "elle" ? "kotu" : ""}">${esc(ISIMLI[x.durum] || x.durum)}</span></td><td class="n">${esc(x.takip || "")}</td></tr>`).join("")}</tbody></table>`;
  $("siparisler").innerHTML = h;
}

function olayKart(d) {
  let gun = null, h = "";
  for (const o of d.olaylar) {
    const z = tarihOku(o.zaman), g = gunAdi(z);
    if (g !== gun) { h += `<li class="gun-bas">${esc(g)}</li>`; gun = g; }
    const urun = o.urunler.length ? esc(o.urunler.join(", ")) + " " : "";
    let ozne = "";
    if (o.tasarimlar.length === 1) ozne = `<b>${esc(o.tasarimlar[0].slogan || "#" + o.tasarimlar[0].id)}</b>: `;
    else if (o.tasarimlar.length > 1) ozne = `<b title="${esc(o.tasarimlar.map(t => t.slogan).join("\n"))}">${o.tasarimlar.length} tasarım</b>: `;
    h += `<li class="olay ${o.tur}"><span>${ozne}${urun}${esc(o.metin)}</span><time datetime="${esc(o.zaman)}">${saat(z)}</time></li>`;
  }
  $("olaylar").innerHTML = h ? `<ul class="zaman-cizelgesi">${h}</ul>` : `<p class="not">Henüz kayıt yok.</p>`;
}

function yol(d) {
  const r = d.roadmap, bitti = r.filter(x => x.durum === "bitti").length, suren = r.filter(x => x.durum === "suruyor");
  const sira = { bitti: 0, suruyor: 1, bekliyor: 2 };
  $("yol-not").textContent = `${bitti}/${r.length} faz bitti, ${suren.length} sürüyor`;
  $("segmentler").style.setProperty("--n", r.length);
  $("segmentler").setAttribute("aria-label", `${r.length} fazın ${bitti} tanesi bitti, ${suren.length} tanesi sürüyor`);
  $("segmentler").innerHTML = [...r].sort((a, b) => sira[a.durum] - sira[b.durum] || a.no - b.no).map(x => `<i class="${x.durum}" title="${x.no}. ${esc(x.ad)}"></i>`).join("");
  $("fazlar").innerHTML = suren.map(x => `<span class="cip" title="${esc(x.kriter)}"><b>${x.no}</b>${esc(x.ad.replace(/\s*\(.*?\)/g, "").replace(/\s*[—–]\s*/g, ": ").replace(/\s+,/g, ",").trim())}</span>`).join("");
}

function ciz(d) {
  if (!d) return;
  ust(d); giris(d); siradaki(d); vitrin(d); paraKart(d); grafik(d); hat(d); pinKart(d); kosuKart(d); tiktokKart(d); siparisKart(d); olayKart(d); yol(d);
  $("altbilgi").textContent = `Veriler bu bilgisayardan okunur, Etsy görüntülenmesi günlük koşuda ölçülür. Son güncelleme ${saat(new Date())}.`;
}

async function yukle() {
  try {
    son = await (await fetch("/api/pano")).json();
    ciz(son);
  } catch (e) {
    $("durum").innerHTML = `<span class="nokta kotu"></span><span class="uzun">Pano verisi alınamadı. Sunucu kapalı olabilir.</span>`;
  }
  setTimeout(() => document.body.classList.remove("ilk"), 1200);
}
yukle();
setInterval(() => { if (!document.hidden) yukle(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) yukle(); });
</script>
</body>
</html>
