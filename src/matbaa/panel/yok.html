<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa yok · Matbaa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c2392a'/%3E%3Cpath d='M9 22V10h4l3 6 3-6h4v12' fill='none' stroke='%23ffffff' stroke-width='3'/%3E%3C/svg%3E">
<style>
  /* Token'lar DESIGN.md frontmatter'ından (pano: açıkta kâğıt, koyuda masa). */
  @font-face { font-family: "Matbaa Serif"; src: url("/font/serif") format("truetype"); font-display: swap; }
  :root {
    color-scheme: light dark;
    --zemin: #f3efe6; --yuzey: #fbf9f4; --cizgi: #e0d9ca; --metin: #1f1d1a; --metin-2: #605b52;
    --kirmizi: #c2392a; --odak: #2f5fd0;
    --serif: "Matbaa Serif", Georgia, "Times New Roman", serif;
    --govde: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --zemin: #17171a; --yuzey: #212125; --cizgi: #34343a; --metin: #ecebe6; --metin-2: #a3a19a; --kirmizi: #e0483e; --odak: #8fb3ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--zemin); color: var(--metin); font: 15px/1.5 var(--govde); padding: 24px 16px; }
  main { position: relative; width: min(100%, 480px); background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 12px; padding: 32px 28px; }
  /* baskı kesim işaretleri: panodaki "Sıradaki" kartıyla aynı dil */
  main::before, main::after { content: ""; position: absolute; width: 14px; height: 14px; border-color: var(--metin-2); border-style: solid; }
  main::before { top: -8px; left: -8px; border-width: 1px 0 0 1px; }
  main::after { bottom: -8px; right: -8px; border-width: 0 1px 1px 0; }
  .kod { font: 12px/1 var(--mono); letter-spacing: .08em; color: var(--kirmizi); margin: 0 0 12px; }
  h1 { font: 400 34px/1.1 var(--serif); margin: 0 0 10px; }
  p { margin: 0 0 24px; color: var(--metin-2); }
  nav { display: flex; gap: 8px; flex-wrap: wrap; }
  a { display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--cizgi); color: var(--metin); text-decoration: none; font-size: 14px; }
  a:hover { background: var(--zemin); }
  a:focus-visible { outline: 2px solid var(--odak); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <p class="kod">404 · PROVA YOK</p>
  <h1>Bu sayfa basılmamış.</h1>
  <p>Adres panelde yok. Panoya ya da onay masasına dön.</p>
  <nav aria-label="Panel">
    <a href="/">Pano</a>
    <a href="/onay">Onay masası</a>
  </nav>
</main>
</body>
</html>
