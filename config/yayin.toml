# Yayın ısınma eğrisi: yeni Etsy mağazasında ani toplu ilan ödeme bekletmesi ve askı riskini artırır (araştırma 01, S7).
# Satırlar: [başlangıç günü, bitiş günü, günlük en çok TASARIM]. Her tasarım urunler.toml'daki her ürüne dönüşür (şu an 3 ilan).
isinma = [[0, 7, 1], [7, 21, 2], [21, 45, 4], [45, 90, 6], [90, 100000, 8]]
# Star Seller olduktan sonra elle yükseltilebilir; mağaza yaşı ilk yayın gününden sayılır.

[printify]
# Kataloğu ilk bağlantıda eşleyip doldurmak için: `uv run matbaa printify-kesif`. Sağlayıcı keşif çıktısından seçilip kilitlenir (K-2, K-20: numune yok).
# K-24 (2026-10-13): ABD sağlayıcıları gerçek maliyet + renk kapsamıyla seçildi (her ürüne en ucuz, renkleri tutan).
tisort = { blueprint_ara = "Comfort Colors 1717", blueprint_id = 706, saglayici_id = 29 }    # Monster Digital, FL
sweatshirt = { blueprint_ara = "Gildan 18000", blueprint_id = 49, saglayici_id = 39 }        # SwiftPOD, CA
kupa = { blueprint_id = 478, saglayici_id = 39 }   # Ceramic Mug 11/15oz, SwiftPOD (Faz 14; katalog "Generic brand", arama adı yok)
hoodie = { blueprint_ara = "Gildan 18500", blueprint_id = 77, saglayici_id = 410 }           # Printful, NC

[etsy]
# K-27: "api" = kendi Etsy uygulamamızla eşleme (aşağıdaki iki kimlik); "elle" = API onayı gelmeden yedek yol: Printify yayınlar,
# üretim ortağını kendisi bağlar, kargo profili Etsy'de elle kurulan "Free US shipping" (elle_kargo_hazir = true olunca yayın açılır).
mod = "api"  # 2026-10-13 21:20: Etsy kişisel uygulama onaylandı, OAuth alındı
elle_kargo_hazir = true  # 2026-10-13: Etsy'de "Free US shipping" (33014, yalnız ABD, ücretsiz) + "Made to order (3-5 days)" kuruldu
uretim_ortagi_id = 5837094   # Etsy "Printify" üretim ortağı (vitrin başlığı "A print-on-demand print shop"); 0 iken yayın durur
kargo_profili_id = 317951156022   # Etsy "Free US shipping" (elle kuruldu 2026-10-13); `uv run matbaa etsy-kargo-profili` açar ve yazar: ABD'ye ücretsiz kargo (K-23); 0 iken yayın durur
