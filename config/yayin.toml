# Yayın ısınma eğrisi: yeni Etsy mağazasında ani toplu ilan ödeme bekletmesi ve askı riskini artırır (araştırma 01, S7).
# Satırlar: [başlangıç günü, bitiş günü, günlük en çok TASARIM]. Her tasarım urunler.toml'daki her ürüne dönüşür (şu an 3 ilan).
# K-37 (2026-10-18): yeni tasarım yayını durdu. Scryne eski tasarım dilini satmaz buldu ("kimse almaz"); onaylı kuyruk yayına girmez,
# yeni dil (trend verisiyle) gelince eğri geri açılır. Önceki (K-36): [[0, 21, 3], [21, 45, 4], [45, 90, 6], [90, 100000, 8]]
# İlk çizimli parti tek seferde (12 tasarım): para sınırı tavanlar.toml'da.
# İlk çizimli parti (12 tasarım, 24 ilan) 2026-10-18'de açıldı; 2 haftalık ölçüme kadar yeni yayın yok (K-37).
isinma = [[0, 100000, 0]]
# K-37: yazılı (tipografik) motorla yeni ifade/tasarım üretilmez; yayına yalnız bu nişlerin tasarımları girer (boş = hepsi).
# Çizimli hat (cizim.py) kendi kavram listesinden üretir. Eski onaylı kuyruk yerinde durur, yayınlanmaz.
tipografik_uretim = false
# K-37: giyilmiş ürün videosu (K-35) günlük hatta kapalı: her gün ~20 dk GPU ve ~11 GB RAM; bellek darlığında koşu düşüyordu.
giyim_videosu = false
yayin_nisleri = ["cozy_christmas"]
# Star Seller olduktan sonra elle yükseltilebilir; mağaza yaşı ilk yayın gününden sayılır.

[printify]
