[etsy]
# K-27: "api" = kendi Etsy uygulamamızla eşleme (aşağıdaki iki kimlik); "elle" = API onayı gelmeden yedek yol: Printify yayınlar,
# üretim ortağını kendisi bağlar, kargo profili Etsy'de elle kurulan "Free US shipping" (elle_kargo_hazir = true olunca yayın açılır).
mod = "api"  # 2026-10-13 21:20: Etsy kişisel uygulama onaylandı, OAuth alındı
elle_kargo_hazir = true  # 2026-10-13: Etsy'de "Free US shipping" (33014, yalnız ABD, ücretsiz) + "Made to order (3-5 days)" kuruldu
uretim_ortagi_id = 5837094   # Etsy "Printify" üretim ortağı (vitrin başlığı "A print-on-demand print shop"); 0 iken yayın durur
hazirlama_profili_id = 1523987889533   # Etsy işlem süresi "Made to order, 3-5 days"; Printify ilanı kendi "2-5 days" (1522739069412) profiline bağlar, eşlemede düzeltilir. 0 iken dokunulmaz
iade_politikasi_id = 1522689119248   # Printify'ın ilanlara bağladığı iade politikası (isimli ilan doğrudan açılırken aynısı)
kargo_profili_id = 317951156022   # Etsy "Free US shipping" (elle kuruldu 2026-10-13); `uv run matbaa etsy-kargo-profili` açar ve yazar: ABD'ye ücretsiz kargo (K-23); 0 iken yayın durur
