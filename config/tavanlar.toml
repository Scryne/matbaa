# Para harcayan her kod yolu burada bir tavanla durur (K-7). Aşılınca hat o adımı para harcamadan atlar, kayda yazar.
# Kodda Etsy Ads, Etsy Plus/Premium ya da ücretli reklam çağrısı yoktur. Etsy Ads'in API'si yok: Scryne Shop Manager'dan açar,
# değerler kayıt içindir (K-36, 2026-10-18): 10-28'den itibaren günde $2; $30 harcanıp sipariş yoksa kapanır.
# Karar K-22 (2026-10-13): Scryne kararı "en yüksek kazanç" hedefiyle Aria'ya bıraktı; değerler bu hedefle seçildi.

# Etsy listeleme ücreti ($0,20 / ilan, ucretler.toml). Takvim ayında Printify'a açılan ürün × ücret bu tavanı aşamaz.
# Tavan = taban + son 30 günün sipariş neti × yeniden_yatirim_orani: satış yokken kayıp $60/ay ile sınırlı, satış geldikçe
# kazancın yarısı yeni ilana döner ve büyüme kendini finanse eder. Taban ısınma eğrisinin ilk ayını (~210 ilan ≈ $42) karşılar;
# ikinci ayın tam hızı (~370 ilan ≈ $74) ancak satış gelirse açılır. Otomatik yenilemeler (4 ayda bir) dahil değil.
# K-37 (2026-10-18): bakiye −602,95 TL (ilan başı $0.20 + %20 KDV = ~11,9 TL). Yeni tasarım dili hazır olana kadar yeni ilan
# ücreti yok: 0 iken tavan süs/isimli ek ürünler dahil her ilan açılışını durdurur. Önceki değer 60.0.
# İlk çizimli parti (12 tasarım × 2 = 24 ilan, $4.80): bu ay $7 harcanmıştı, tavan $12 en çok 25 ilana izin verir.
# K-40 (2026-10-23): Scryne "ilan vermiycez artık, sakın ilan verme, paramız eksi, dondurmuştuk". Yeni ilan yok: tavan 0 ve
# satış neti de yeni ilana dönmez (oran 0). Süs/isimli süs dahil her açılış durur; Kasım ayı başında da açılmaz.
aylik_ilan_ucreti_usd = 0.0
yeniden_yatirim_orani = 0.0

# TypeSafe/Jev (IP kapısının anlamsal katmanı): günde en çok bu kadar ifade denetlenir (ifade başına 1–2 çağrı).
# Günlük koşu talebe bağlı en çok 2 niş × 12 ifade üretir; tavan ani bir döngü hatasına karşı.
gunluk_ip_denetim = 120

# Etsy Ads (K-36): elle açılır ve kapatılır; kod okumaz, haftalık raporda karşılaştırma için.
etsy_ads_gunluk_usd = 2.0
etsy_ads_deneme_tavani_usd = 30.0
