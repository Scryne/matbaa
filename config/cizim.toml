# K-37 (2026-10-18): çizimli hattın kavram listesi. Kaynak: Etsy API trend ölçümü (son 90 günde en hızlı görüntülenen yeni
# giyim ilanları + Noel giyiminde en çok favorilenen ilanlar): sevimli karakter, kış/Noel, kahve/kitap/köpek/kedi/meslek esprisi.
# Kurallar: karakter özgün (çizgi film/film/marka karakteri yok), yazı IP kapısından geçer (USPTO + Jev), çizime yazı girmez
# (yazıyı motor fonttan dizer). `ust` kavisli üst satır, `alt` düz alt satır; `dolgu` yazının iç rengi (dış çizgi çizimden).
# Fontlar varliklar/fontlar (OFL). Yeni kavram eklemek: blok ekle, `uv run matbaa cizim --kavram <ad>`.

[[kavram]]
ad = "snowman_coffee"
konu = "A chubby happy snowman in a chunky knitted rust-orange scarf holding a big iced coffee cup with a straw"
ust = "COLD OUTSIDE"
alt = "ICED COFFEE INSIDE"
dolgu = "#c4772f"
font_ust = "LilitaOne-Regular.ttf"
font_alt = "TitanOne-Regular.ttf"

