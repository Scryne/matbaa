# K-38 (2026-10-20): videoların platform başına yayın saatleri (ABD doğu; alıcıların çoğu doğu/orta saat diliminde) ve zamanlı
# gönderme ufku. Platform yalnız Zernio'da hesabı bağlıysa açılır (paylasim.istemciler).
#
# ileri_gun: gönderi yayın saatinden en çok bu kadar gün önce Zernio'da zamanlanır; yayını Zernio sunucusu yapar (bilgisayar o
# saatte kapalı olsa da). Zernio'ya yüklenen medya 7 gün saklanıyor: 7'yi geçmez.
# Günde iki: Buffer TikTok'ta günde 1-3 öneriyor (araştırma 08); 30 tasarımlık birikim ~15 günde biter. Pinterest'in video pinleri
# ilan pinlerinden (pinterest.py, günde ayrıca) ayrı saatlerde.

[tiktok]
saatler = ["12:00", "19:00"]
ileri_gun = 7

