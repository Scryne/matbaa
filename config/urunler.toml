[susleme]
# K-30 (2026-10-14): yılbaşı süsü, Printify 1632 "Ceramic Decoration Ornament (1pc)", SwiftPOD (39), UV baskı, iki yüz.
# Maliyet geçici ürünle okundu: Round $4.93, Round + White Gift Packaging $7.06; ABD kargo $4.79 / $5.89 (ihtiyatlı $5.89).
# Tek yüz: canlı ilk iki süste arka baskı maliyeti $6.57'ye çıkardı (+$1.64); $21.99'da net $4.30 (Offsite $0.34). Çift yüzü
# aynı nete taşımak $23.99 ister; tek yüz $21.99 net $5.94 (Offsite $1.98) ve alıcıya ucuz. Ön yüzde zaten "CHRISTMAS <yıl>" var.
# Etsy API ölçümü (2026-10-14, üst 100 ilan): süsün talebi tişörtün fishing 3,7×, running 1,8×, knitting 2,8× katı; medyan fiyat
# ~$20. Diğer nişlerde (aunt, band mom, bowling, senior mom, pickleball) süs talebi tişörtün altında: açılmaz.
# Fiyat $21.99 ücretsiz kargo: rakip medyanı ~$20 + çoğunlukla ayrı kargo; alıcı toplamı yine düşük. $19.99 net $4.36 ile
# "her ürün > $5" kuralının altındaydı. Hediye kutulu varyant +$3 (net ~+$0.3).
ad = "Ceramic Christmas Ornament"
blank = "Ceramic Ornament"
etsy_turu = "Christmas Ornament"
fiyat = 21.99
kargo = 0.0
buyuk_beden_ek = { "Round + White Gift Packaging" = 3.00 }
bedenler = ["Round", "Round + White Gift Packaging"]
beden_anahtari = "shape"   # Printify varyant seçeneği: süsün "size"ı tek ("One size"), seçim "shape"te
tahmini_maliyet = 4.93
tahmini_abd_kargo = 6.29   # 2026-10-15 iki gerçek Printify siparişinde (NY) $6.29; katalog $5.89 diyor, ölçülen esas
renkler = [{ ad = "White", murekkep = "koyu", hex = "#ffffff" }]
detay = "Round white ceramic ornament, about 3 inches across, printed on the front with a matte finish, with a golden hanging string included."
govde_etiketi = "Ornament"
yuzey = "front of a round ceramic Christmas ornament, with CHRISTMAS and the year curved under the design (back left plain glossy white)"
iki_yuz = false   # arka baskı (MERRY CHRISTMAS + yıl + çizim) maliyeti +$1.64: kapalı, bkz. yukarı
oznitelik = { "Primary color" = ["White"], "Materials" = ["Ceramic"], "Holiday" = ["Christmas"] }
beden_metni = "Options: the ornament on its own, or with a white gift box ready to wrap. The design and CHRISTMAS with the year are printed on the front; the back is plain glossy white ceramic."
bakim_metni = "Care: wipe clean with a soft dry cloth. Ceramic, handle with care; not a toy."
istem_notu = "This is a dated Christmas keepsake ornament for this year's tree: put 'Christmas Ornament' and the year in the title, gift angle for this Christmas."
# Kimlere açılır: bu nişler + metninde Noel kelimesi geçen her tasarım. Pencere dışında açılmaz ve yayınlanmaz (ay-gün);
# `kapanis`tan sonra aktif süs ilanları Etsy'de pasife alınır (yıllı ürün Ocak'ta satmaz, yenileme ücreti boşa gitmez).
kosul = { nisler = ["fishing", "running", "knitting"], mevsim_kelimesi = true, bas = "09-15", son = "12-10", kapanis = "12-26" }

[isimli_susleme]
# Faz 11 öne alındı (2026-10-15): isimli yılbaşı süsü. Etsy'de üst sıralardaki süslerin çoğu kişiselleştirilmiş (K-30 ölçümü).
# Aynı Printify 1632 / SwiftPOD süs, tek yüz; ön yüzde tasarım küçülür, ortada alıcının yazdığı isim (Pacifico), altta yıl yayı.
# Kanal "etsy": ilan Printify'a bağlanmadan doğrudan Etsy API ile açılır (Printify'ın kendi kişiselleştirmesi her siparişi elle
# onay bekletiyor, 2026-10-15 araştırma). Sipariş gelince `isimli.siparisleri_isle` ismi basar, Printify'da tek seferlik ürün +
# API siparişi açar (external_id = Etsy makbuzu), üretime gönderir, takibi Etsy'ye yazar. Printify bağlı olmayan ilanın Etsy
# siparişini otomatik içe aktarmaz ("Other orders"): çift üretim yok.
# Fiyat $24.99 ücretsiz kargo: net $7.90 (Offsite $3.41, ölçülen kargo $6.29 ile); düz süsten $3 pahalı (isim primi), rakip isimli süsler ~$18-30.
ad = "Personalized Ceramic Christmas Ornament"
blank = "Ceramic Ornament"
etsy_turu = "Personalized Christmas Ornament"
kanal = "etsy"
etsy_taksonomi = 1857   # Etsy "Ornaments" (Printify'ın süs ilanlarına verdiği kategori, 2026-10-15)
fiyat = 24.99
kargo = 0.0
buyuk_beden_ek = { "Round + White Gift Packaging" = 3.00 }
bedenler = ["Round", "Round + White Gift Packaging"]
beden_anahtari = "shape"
tahmini_maliyet = 4.93
tahmini_abd_kargo = 6.29   # 2026-10-15 iki gerçek Printify siparişinde (NY) $6.29; katalog $5.89 diyor, ölçülen esas
renkler = [{ ad = "White", murekkep = "koyu", hex = "#ffffff" }]
detay = "Round white ceramic ornament, about 3 inches across, printed on the front with your name in script under the design, with a golden hanging string included."
govde_etiketi = "Ornament"
yuzey = "front of a round ceramic Christmas ornament: the design, the buyer's name in script under it, CHRISTMAS and the year curved at the bottom (back left plain glossy white)"
iki_yuz = false
oznitelik = { "Primary color" = ["White"], "Materials" = ["Ceramic"], "Holiday" = ["Christmas"] }
beden_metni = "Personalization: type the name you want printed (up to 14 characters). We print it exactly as you type it, so please check the spelling. Options: the ornament on its own, or with a white gift box ready to wrap. The back is plain glossy white ceramic."
bakim_metni = "Care: wipe clean with a soft dry cloth. Ceramic, handle with care; not a toy."
istem_notu = "This is a PERSONALIZED dated Christmas keepsake ornament: the buyer's name is printed under the design. Start the title with 'Personalized' and put 'Christmas Ornament', 'Custom Name' and the year in it; gift angle for this Christmas."
kisisel = { soru = "Name", aciklama = "Name to print under the design, up to 14 characters. We print it exactly as you type it.", maks = 14 }
ornek_isimler = ["Grandpa Joe", "Emma", "Dad"]
kosul = { nisler = ["fishing", "running", "knitting"], mevsim_kelimesi = true, bas = "09-15", son = "12-07", kapanis = "12-26" }

