# Ürün kataloğu (K-11). Maliyet ve kargo Printify'dan gerçek değer (K-24, 2026-10-13: geçici ürünle okundu, S–XL bedeni;
# kargo ABD ilk ürün). Büyük beden eki = maliyet farkı / ~0,75 (Etsy ücretleri eki de keser): net beden başına korunur.
# Renk adları Printify varyant adlarıdır; "murekkep" o renkte hangi baskı dosyasının kullanılacağını söyler.
# Fiyat K-23 (2026-10-13): ABD kargosu fiyata gömülü, ilan "FREE shipping" (Etsy ABD aramasında ücretsiz/≤$6 kargo öncelikli).
# Alıcının ödediği toplam eskisiyle aynı (28.99+4.99 → 33.99), net değişmez. Piyasa medyanına (tişört ~$22, sweatshirt ~$37) inmek
# TR ücret yığınıyla zarar: fiyatı satış verisi düşürür, tahmin değil.

[tisort]
ad = "Comfort Colors 1717 Garment-Dyed Tee"
blank = "Comfort Colors 1717"
etsy_turu = "T-shirt"
# Etsy öznitelikleri (ilan/oznitelik.py; ad ve değerler Etsy'nin adlarıyla). Primary color = vitrin rengi (ilk fotoğraf).
oznitelik = { "Primary color" = ["Yellow"], "Sleeve length" = ["Short sleeve"], "Neckline" = ["Crew"], "Materials" = ["Cotton"] }
vitrin_rengi = "Butter"   # ilk ilan görseli: beyaz Etsy sayfasında beyaz tişört silik kalıyordu (2026-10-13)
fiyat = 33.99
kargo = 0.0
buyuk_beden_ek = { "2XL" = 2.00, "3XL" = 4.50 }   # Monster Digital: 2XL +$1.24, 3XL +$3.40
bedenler = ["S", "M", "L", "XL", "2XL", "3XL"]
tahmini_maliyet = 13.04    # Monster Digital (29)
tahmini_abd_kargo = 4.49
renkler = [   # Monster Digital'de "Sage" ve "True Navy" yok (K-24): Navy onun yerine
  { ad = "White", murekkep = "koyu", hex = "#ffffff" },
  { ad = "Ivory", murekkep = "koyu", hex = "#f0e8d6" },
  { ad = "Butter", murekkep = "koyu", hex = "#f3dfa2" },
  { ad = "Black", murekkep = "acik", hex = "#1b1b1b" },
  { ad = "Navy", murekkep = "acik", hex = "#1f2a44" },
  { ad = "Pepper", murekkep = "acik", hex = "#4a4a48" },
]
# Ölçüler (Comfort Colors 1717 teknik föyü, ikincil iki kaynakla aynı, araştırma 2026-10-13): beden tablosu görseli (ilan/gorsel.py)
olculer = { kesim = "relaxed unisex fit", sutunlar = ["SIZE", "WIDTH (IN)", "LENGTH (IN)"], satirlar = [["S", "18.25", "26.6"], ["M", "20.25", "28"], ["L", "22", "29.4"], ["XL", "24", "30.75"], ["2XL", "26", "31.6"], ["3XL", "27.75", "32.5"]], notlar = ["MEASURED FLAT: WIDTH 1 INCH BELOW THE ARMPITS, LENGTH FROM SHOULDER TO HEM", "MEASUREMENTS CAN VARY BY UP TO 1 INCH"] }
detay = "Garment-dyed, heavyweight 100% ring-spun cotton (6.1 oz) with a soft, lived-in feel and relaxed fit."

